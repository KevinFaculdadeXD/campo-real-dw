; Copie para config.ini e preencha. NUNCA suba o config.ini para o Git.
; Alternativa: variavel de ambiente CRE_CONFIG apontando para outro arquivo.
; A senha tambem pode vir de CRE_PG_PASSWORD (tem prioridade sobre o arquivo).

[postgres]
host = ep-xxxx.sa-east-1.aws.neon.tech
port = 5432
database = neondb
user = SEU_USUARIO
password = SUA_SENHA
sslmode = require

[schemas]
origem = campo_real_energia

[http]
timeout_s = 60
max_tentativas = 5
espera_base_s = 2
espera_max_s = 60
; vazio = User-Agent padrao do requests. Se o portal bloquear (HTTP 403), teste com diagnostico_ccee.py
user_agent =

[ccee]
api_base = https://dadosabertos.ccee.org.br/api/3/action
dataset = pld_horario
anos = 2025,2026
page_size = 5000
; Opcional: fixar o resource_id de cada ano (senao o extrator descobre via package_show)
; resource_id_2025 = 2a180a6b-f092-43eb-9f82-a48798b803dc
; resource_id_2026 =

[open_meteo]
api_url = https://archive-api.open-meteo.com/v1/archive
data_inicio = 2025-01-01
; defasagem do arquivo historico (o Open-Meteo publica com alguns dias de atraso)
defasagem_dias = 6
variaveis = temperature_2m,wind_speed_10m,wind_speed_100m,shortwave_radiation,precipitation
timezone = America/Sao_Paulo
pausa_entre_chamadas_s = 2
